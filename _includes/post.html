<article class="box post">
   <p class="post_date">{{ post.date | date: '%d.%m.%Y' }}</p>
   <h2><a href="{{ post.url }}" title="Permalink">{{ post.title }}</a></h2>
   
   {{ current_content }}
   
   {% if post.tags %}
      <p class="tags"><strong>Tags:</strong> 
         {% for tag in post.tags %}{{ tag }} {% endfor %}
      </p>
   {% endif %}
</article>
