<html>
	<head>
		<script type="application/javascript">
			var ctx;
			var letters = new Array();
			var angle = 0;
			var scaleFactor = 1;
			
			function letter(x, y) {
				this.quads = new Array();
				var mx = x;
				var my = y;
				var vx = Math.random() * 0.5 - 0.25;
				var vy = Math.random() * 0.5 - 0.25;
				var rx = mx;
				var ry = my;
				
				this.draw = function () {
					ctx.save();
					ctx.translate(rx, ry);
					rx = rx + vx;
					ry = ry + vy;
					var lx = mx - rx;
					var ly = my - ry;
					if (Math.abs(lx) > 5) {
						vx = vx * 0.75;
					}
					if (Math.abs(ly) > 5) {
						vy = vy * 0.75;
					}
					vx = vx + lx * Math.random() * 0.25;
					vy = vy + ly * Math.random() * 0.25;
					
					for (var i = 0; i < this.quads.length; i++) {
						this.quads[i].draw();
					}
					ctx.restore();
				}
			}
			
			function letterN (x, y) {
				this.inheritFrom = letter;
				this.inheritFrom(x, y);
				
				this.quads.push(new quad(0, 15, 15, 0, 0, 15, 40, 40));
				this.quads.push(new quad(25, 40, 40, 25, 0, 0, 40, 25));
			}
			
			function letterU(x, y) {
				this.inheritFrom = letter;
				this.inheritFrom(x, y);
				
				this.quads.push(new quad(0, 15, 15, 0, 0, 0, 40, 25));
				this.quads.push(new quad(25, 40, 40, 25, 0, 0, 25, 40));
			}
			
			function letterL(x, y) {
				this.inheritFrom = letter;
				this.inheritFrom(x, y);
				
				this.quads.push(new quad(0, 15, 15, 0, 0, 0, 40, 25));
				this.quads.push(new quad(25, 40, 40, 25, 25, 40, 40, 40));
			}
			
			function letterP(x, y) {
				this.inheritFrom = letter;
				this.inheritFrom(x, y);
				
				this.quads.push(new quad(0, 15, 15, 0, 0, 0, 40, 25));
				this.quads.push(new quad(25, 40, 40, 25, 0, 15, 15, 30));
			}
			
			function letterK(x, y) {
				this.inheritFrom = letter;
				this.inheritFrom(x, y);
				
				this.quads.push(new quad(0, 15, 15, 0, 0, 0, 40, 40));
				this.quads.push(new quad(25, 40, 40, 25, 0, 0, 0, 15));
				this.quads.push(new quad(25, 40, 40, 25, 25, 40, 40, 40));
			}
			
			function letterT(x, y) {
				this.inheritFrom = letter;
				this.inheritFrom(x, y);
				
				this.quads.push(new quad(0, 15, 15, 15, 0, 0, 0, 15));
				this.quads.push(new quad(25, 40, 40, 25, 0, 0, 25, 40));
			}
			
			function letterE(x, y) {
				this.inheritFrom = letter;
				this.inheritFrom(x, y);
				
				this.quads.push(new quad(0, 15, 15, 0, 15, 0, 40, 25));
				this.quads.push(new quad(25, 40, 40, 25, 0, 0, 0, 15));
				this.quads.push(new quad(25, 40, 40, 25, 25, 40, 40, 40));
			}
			
			function letterExcl(x, y) {
				this.inheritFrom = letter;
				this.inheritFrom(x, y);
				
				this.quads.push(new quad(0, 15, 15, 0, 0, 0, 25, 10));
				this.quads.push(new quad(0, 15, 15, 0, 25, 40, 40, 40));
			}
			
			function quad(x1, x2, x3, x4, y1, y2, y3, y4) {
				this.x = new Array(x1, x2, x3, x4);
				this.y = new Array(y1, y2, y3, y4);
				
				var r = Math.floor(Math.random()*255);
				var g = Math.floor(Math.random()*255);
				var b = Math.floor(Math.random()*255);
				
				while (r + g + b < 127) {
					r += 10;
					g += 10;
					b += 10;
				}
				
				this.draw = function() {
					ctx.save();
					ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
					
					ctx.beginPath();
					ctx.moveTo(this.x[0], this.y[0]);
					for (i = 1; i < 4; i++) {
						ctx.lineTo(this.x[i], this.y[i]);
					}
					ctx.lineTo(this.x[0], this.y[0]);
					ctx.closePath();
					ctx.fill();
					ctx.restore();
				}
			}
			
			function init() {
				ctx = document.getElementById("canvas").getContext("2d");
				
				letters.push(new letterN(10, 10));
				letters.push(new letterU(70, 10));
				letters.push(new letterL(130, 10));
				letters.push(new letterL(190, 10));
				
				letters.push(new letterP(270, 10));
				letters.push(new letterU(330, 10));
				letters.push(new letterN(390, 10));
				letters.push(new letterK(450, 10));
				letters.push(new letterT(505, 10));
				letters.push(new letterE(565, 10));
				
				letters.push(new letterExcl(635, 10));
				letters.push(new letterExcl(670, 10));
				
				return setInterval(animate, 100);
				
				ctx.fillStyle = "black";
				ctx.fillRect(0,0,700,700);
			}
			
			function animate() {
				ctx.save();
				ctx.fillStyle = "rgba(0,0,0,0.5)";
				ctx.fillRect(0,0,700, 700);
				
				//ctx.translate(350, 350);
				//ctx.rotate(angle);
				//ctx.scale(Math.abs(scaleFactor), 1);
				//ctx.translate(-350, -40);
				//angle += 0.05;
				//if (angle <= Math.PI * 2) {
				//	angle -= Math.PI * 2;
				//}
				//scaleFactor-= 0.04;
				//if (scaleFactor <= -1) {
				//	scaleFactor = 1;
				//}
				ctx.translate(0, 310);
				for(var i=0; i<letters.length; i++) {
					letters[i].draw();
				}
				ctx.restore();
			}
		</script>
	</head>
	
	<body onload="init()">
		<canvas id="canvas" width="700" height="700"></canvas>
	</body>
</html>
