<html>
	<head>
		<script type="application/javascript">
			var ctx;
			var quads = new Array();
			var angle = 0;
			var scaleFactor = 1;
			
			function quad() {
				this.x = new Array();
				this.y = new Array();
				
				var r = Math.floor(Math.random()*255);
				var g = Math.floor(Math.random()*255);
				var b = Math.floor(Math.random()*255);
				
				while (r + g + b < 127) {
					r += 10;
					g += 10;
					b += 10;
				}
				
				this.draw = function() {
					ctx.save();
					ctx.translate(Math.random() - 0.5, Math.random() - 0.5);
					ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
					
					ctx.beginPath();
					ctx.moveTo(this.x[0], this.y[0]);
					for (i=1; i<this.x.length;i++) {
						ctx.lineTo(this.x[i], this.y[i]);
					}
					ctx.lineTo(this.x[0], this.y[0]);
					ctx.closePath();
					ctx.fill();
					
					ctx.restore();
				}
			}
			
			function addQuad(x1, x2, x3, x4, y1, y2, y3, y4) {
				var curQuad = new quad();
				curQuad.x.push(x1, x2, x3, x4);
				curQuad.y.push(y1, y2, y3, y4);
				quads.push(curQuad);
			}
			
			function init() {
				ctx = document.getElementById("canvas").getContext("2d");
				
				addQuad (10, 25, 25, 10, 10, 25, 50, 50);
				addQuad (35, 50, 50, 35, 10, 10, 50, 35);
				addQuad (70, 85, 85, 70, 10, 10, 50, 35);
				addQuad (95, 110, 110, 95, 10, 10, 35, 50);
				addQuad (130, 145, 145, 130, 10, 10, 50, 35);
				addQuad (155, 170, 170, 155, 35, 50, 50, 50);
				addQuad (190, 205, 205, 190, 10, 10, 50, 35);
				addQuad (215, 230, 230, 215, 35, 50, 50, 50);
				
				addQuad (270, 285, 285, 270, 10, 10, 50, 35);
				addQuad (295, 310, 310, 295, 10, 25, 25, 40);
				addQuad (330, 345, 345, 330, 10, 10, 50, 35);
				addQuad (355, 370, 370, 355, 10, 10, 35, 50);
				addQuad (390, 405, 405, 390, 10, 25, 50, 50);
				addQuad (415, 430, 430, 415, 10, 10, 50, 35);
				addQuad (450, 465, 465, 450, 10, 10, 50, 50);
				addQuad (475, 490, 490, 475, 10, 10, 10, 25);
				addQuad (475, 490, 490, 475, 35, 50, 50, 50);
				addQuad (505, 520, 520, 520, 10, 10, 10, 25);
				addQuad (530, 545, 545, 530, 10, 10, 35, 50);
				addQuad (565, 580, 580, 565, 25, 10, 50, 35);
				addQuad (590, 605, 605, 590, 10, 10, 10, 25);
				addQuad (590, 605, 605, 590, 35, 50, 50, 50);
				
				addQuad (635, 650, 650, 635, 10, 10, 35, 20);
				addQuad (635, 650, 650, 635, 35, 50, 50, 50);
				addQuad (670, 685, 685, 670, 10, 10, 35, 20);
				addQuad (670, 685, 685, 670, 35, 50, 50, 50);
				
				return setInterval(animate, 100);
				
				ctx.fillStyle = "black";
				ctx.fillRect(0,0,700,700);
			}
			
			function animate() {
				ctx.save();
				ctx.fillStyle = "rgba(0,0,0,0.5)";
				ctx.fillRect(0,0,700, 700);
				
				ctx.translate(350, 350);
				ctx.rotate(angle);
				ctx.scale(Math.abs(scaleFactor), 1);
				ctx.translate(-350, -40);
				angle += 0.05;
				if (angle <= Math.PI * 2) {
					angle -= Math.PI * 2;
				}
				scaleFactor-= 0.04;
				if (scaleFactor <= -1) {
					scaleFactor = 1;
				}
				for(var i=0; i<quads.length; i++) {
					quads[i].draw();
				}
				ctx.restore();
			}
		</script>
	</head>
	
	<body onload="init()">
		<canvas id="canvas" width="700" height="700"></canvas>
	</body>
</html>
